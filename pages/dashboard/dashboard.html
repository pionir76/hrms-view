<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 현황 - HRMS</title>
  <link rel="stylesheet" href="../../common/css/common.css" />
  <link rel="stylesheet" href="../../common/css/event-log.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body data-page="dashboard" class="page-dashboard">
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <main class="db-main" id="content">
      <!-- 머리 줄 -->
      <div class="db-head">
        <div>
          <span class="page-eyebrow">Live Monitoring</span>
          <h1>실시간 현황</h1>
        </div>
        <span class="db-live" id="dbLive">불러오는 중</span>
        <div class="db-mode" role="tablist" aria-label="보기 방식">
          <button type="button" class="db-mode-btn active" data-mode="list" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>리스트
          </button>
          <button type="button" class="db-mode-btn" data-mode="map" role="tab" aria-selected="false" disabled title="맵 모드는 준비 중입니다">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14" /></svg>맵<em>준비 중</em>
          </button>
        </div>
      </div>

      <div class="db-body">
        <!-- 좌측: 요약 카드 3개 + 장비 리스트 -->
        <div class="db-col-left">
          <div class="db-kpis">
            <div class="db-card db-kpi t-navy">
              <span class="db-kpi-ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg></span>
              <div class="db-kpi-info">
                <div class="db-kpi-label">전체 장비 운영 현황</div>
                <div class="db-kpi-val" id="kpiTotal">-</div>
                <div class="db-kpi-sub" id="kpiTotalSub">-</div>
              </div>
            </div>
            <div class="db-card db-kpi t-green">
              <span class="db-kpi-ico"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" /></svg></span>
              <div class="db-kpi-info">
                <div class="db-kpi-label">운전 중인 장비</div>
                <div class="db-kpi-val" id="kpiRunning">-</div>
                <div class="db-kpi-sub"><div class="db-bar"><i id="kpiRunningBar"></i></div><b id="kpiRunningPct">-</b></div>
              </div>
            </div>
            <div class="db-card db-kpi t-orange" id="kpiCommCard">
              <span class="db-kpi-ico"><svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01M3 3l18 18" /></svg></span>
              <div class="db-kpi-info">
                <div class="db-kpi-label">통신 불량 장비</div>
                <div class="db-kpi-val" id="kpiComm">-</div>
                <div class="db-kpi-sub">장비 기준 집계</div>
              </div>
            </div>
          </div>

          <div class="db-card db-list">
            <div class="db-list-bar">
              <h2 class="db-list-title">장비 리스트</h2>
              <div class="db-filters" id="dbFilters"></div>
              <input type="search" class="db-search" id="dbSearch" placeholder="장비명·시설동 검색" />
            </div>
            <div class="db-regions" id="dbRegions">
              <div class="empty-state">불러오는 중...</div>
            </div>
          </div>
        </div>

        <!-- 우측: 시스템 정보 + 서버 상태 -->
        <div class="db-col-right">
          <div class="db-card db-sys">
            <div class="db-card-title">시스템 정보<em id="sysCheckedAt">30초 갱신</em></div>
            <div class="db-storage-title">저장소 사용량</div>
            <div class="db-storage">
              <div class="db-donut">
                <svg viewBox="0 0 180 180" aria-hidden="true">
                  <defs>
                    <linearGradient id="dbDonutGrad" x1="0" x2="1" y1="0" y2="1">
                      <stop offset="0" stop-color="#2f6bff" />
                      <stop offset="1" stop-color="#6a4cf5" />
                    </linearGradient>
                  </defs>
                  <circle cx="90" cy="90" r="74" fill="none" stroke="#eef1f6" stroke-width="16" />
                  <circle id="sysDonutArc" cx="90" cy="90" r="74" fill="none" stroke="url(#dbDonutGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="0 465" />
                </svg>
                <div class="db-donut-c"><span>사용률</span><b id="sysStoragePct">-</b></div>
              </div>
              <div class="db-storage-nums">
                <div class="used"><span>사용량</span><b id="sysStorageUsed">-</b></div>
                <div class="total"><span>전체 용량</span><b id="sysStorageTotal">-</b></div>
                <div class="free"><span>남은 용량</span><b id="sysStorageFree">-</b></div>
              </div>
            </div>
            <div class="db-res">
              <div class="db-res-row">
                <span class="db-res-ico"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /><rect x="9.5" y="9.5" width="5" height="5" /><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4" /></svg></span>
                <div class="db-res-top"><span>CPU</span><b id="sysCpu">-</b></div>
                <div class="db-bar cpu"><i id="sysCpuBar"></i></div>
              </div>
              <div class="db-res-row">
                <span class="db-res-ico"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="2" /><path d="M6 11v2M10 11v2M14 11v2M18 11v2M6 17v3M18 17v3" /></svg></span>
                <div class="db-res-top"><span>메모리</span><b id="sysMem">-</b></div>
                <div class="db-bar mem"><i id="sysMemBar"></i></div>
              </div>
            </div>
          </div>

          <div class="db-card db-srv">
            <div class="db-card-title">서버 상태</div>
            <div class="db-srv-list">
              <div class="db-srv-row">
                <span class="db-srv-ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2" /><rect x="3" y="13" width="18" height="7" rx="2" /><path d="M7 7.5h.01M7 16.5h.01" /></svg></span>
                <span class="db-srv-label">서버 상태</span>
                <span class="db-srv-val" id="srvServer">-</span>
              </div>
              <div class="db-srv-row">
                <span class="db-srv-ico"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3" /><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" /></svg></span>
                <span class="db-srv-label">DB 백업</span>
                <span class="db-srv-val" id="srvBackup">-</span>
              </div>
              <div class="db-srv-row">
                <span class="db-srv-ico"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" /><path d="M21 3v5h-5" /></svg></span>
                <span class="db-srv-label">데이터 수집 주기</span>
                <span class="db-srv-val" id="srvCollection">-</span>
              </div>
              <div class="db-srv-row">
                <span class="db-srv-ico"><svg viewBox="0 0 24 24"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M14 5l-4 14" /></svg></span>
                <span class="db-srv-label">API 상태</span>
                <span class="db-srv-val" id="srvApi">-</span>
              </div>
              <div class="db-srv-row">
                <span class="db-srv-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg></span>
                <span class="db-srv-label">시스템 가동시간</span>
                <span class="db-srv-val" id="srvUptime">-</span>
              </div>
            </div>
            <p class="db-sys-error" id="sysError" hidden></p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 하단 이벤트 — 기본은 한 줄 티커, 펼치면 아래에서 목록 패널이 올라온다 -->
  <div class="db-events-panel" id="dbEventsPanel" hidden>
    <div class="db-events-head">
      <b>이벤트 (경보 · 통신장애)</b>
      <div class="chip-group" id="dbEventFilters"></div>
      <span class="db-events-hint">내용을 누르면 상세 정보가 열립니다</span>
    </div>
    <div class="db-events-list" id="dbEventsList"></div>
  </div>
  <div class="db-ticker" id="dbTicker">
    <span class="db-ticker-label">LIVE EVENTS</span>
    <div class="db-ticker-track"><div class="db-ticker-items" id="dbTickerItems"></div></div>
    <button type="button" class="db-ticker-btn" id="dbTickerToggle" aria-expanded="false">
      <span class="db-ticker-new" id="dbTickerNew" hidden>새 이벤트 <em id="dbTickerNewCount">0</em></span>
      <span id="dbTickerToggleText">펼치기</span><span class="db-ticker-chev" aria-hidden="true"></span>
    </button>
  </div>

  <script src="../../common/js/config.js"></script>
  <script src="../../common/js/auth.js"></script>
  <script src="../../common/js/api.js"></script>
  <script src="../../common/js/layout.js"></script>
  <script src="../../common/js/channels.js"></script>
  <script src="../../common/js/ui.js"></script>
  <script src="../../common/js/event-log.js"></script>
  <script src="dashboard.js"></script>
  <script>
    requireAuth();
    renderLayout();
  </script>
</body>
</html>
