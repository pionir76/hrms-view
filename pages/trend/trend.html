<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자료 조회 - HRMS</title>
  <link rel="stylesheet" href="../../common/css/common.css" />
  <link rel="stylesheet" href="../../common/css/trend-view.css" />
  <link rel="stylesheet" href="../../common/css/event-log.css" />
  <link rel="stylesheet" href="trend.css" />
</head>
<body data-page="trend">
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <main class="content content-narrow" id="content">
      <div class="page-header page-header-row">
        <div>
          <span class="page-eyebrow">Data Explorer</span>
          <h1>자료 조회</h1>
          <p>장비와 날짜를 고르면 그날의 압축기 트렌드와 이벤트 이력을 볼 수 있습니다.</p>
        </div>
        <span class="page-header-badge">조회 전용</span>
      </div>

      <!-- 조회 조건: 1,440분 그래프가 주인공이라 좌측 세로 영역 대신 상단 가로 한 줄로 둔다 -->
      <div class="panel dq-filter">
        <div class="field dq-filter-field">
          <label for="dqRegion">지역</label>
          <select id="dqRegion"><option value="">선택</option></select>
        </div>
        <div class="field dq-filter-field">
          <label for="dqBuilding">시설동</label>
          <select id="dqBuilding" disabled><option value="">선택</option></select>
        </div>
        <div class="field dq-filter-field dq-filter-equipment">
          <label for="dqEquipment">설비</label>
          <select id="dqEquipment" disabled><option value="">선택</option></select>
        </div>
        <div class="field dq-filter-field">
          <label for="dqDate">날짜</label>
          <div class="dq-date-row">
            <button type="button" class="btn btn-secondary dq-date-nav" id="dqPrevDay" aria-label="하루 전">◀</button>
            <input type="date" id="dqDate" />
            <button type="button" class="btn btn-secondary dq-date-nav" id="dqNextDay" aria-label="하루 후">▶</button>
          </div>
        </div>
        <button type="button" class="btn btn-primary dq-search-btn" id="dqSearchBtn" disabled>조회</button>
      </div>

      <div class="dq-error" id="dqError" hidden></div>

      <div id="dqEmpty">
        <div class="panel"><div class="empty-state">지역 · 시설동 · 설비와 날짜를 고른 뒤 "조회"를 누르세요.</div></div>
      </div>

      <div id="dqResult" hidden>
        <!-- 요약 타일 (common.css .stat-tile) -->
        <div class="dq-summary">
          <div class="stat-tile stat-tile-blue">
            <div class="stat-tile-top">
              <span class="stat-tile-icon"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3" /></svg></span>
              <span class="stat-tile-label">가동율</span>
            </div>
            <div class="stat-tile-value" id="dqUtilization">-</div>
            <div class="stat-meter"><i id="dqUtilizationMeter"></i></div>
            <div class="stat-tile-sub" id="dqUtilizationSub">-</div>
          </div>
          <div class="stat-tile stat-tile-teal">
            <div class="stat-tile-top">
              <span class="stat-tile-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg></span>
              <span class="stat-tile-label">기록된 시간</span>
            </div>
            <div class="stat-tile-value" id="dqRecorded">-</div>
            <div class="stat-meter"><i id="dqRecordedMeter"></i></div>
            <div class="stat-tile-sub">24시간 중 실제 기록이 있는 시간</div>
          </div>
          <div class="stat-tile stat-tile-red">
            <div class="stat-tile-top">
              <span class="stat-tile-icon"><svg viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3z" /><path d="M12 10v4M12 17h.01" /></svg></span>
              <span class="stat-tile-label">경보</span>
            </div>
            <div class="stat-tile-value" id="dqAlarmCount">-</div>
            <div class="stat-pills" id="dqAlarmPills"></div>
            <div class="stat-tile-sub" id="dqAlarmSub">-</div>
          </div>
          <div class="stat-tile stat-tile-violet">
            <div class="stat-tile-top">
              <span class="stat-tile-icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3" /><path d="M7 10v4M11 10v4" /></svg></span>
              <span class="stat-tile-label">압축기</span>
            </div>
            <div class="stat-tile-value" id="dqCompressorCount">-</div>
            <div class="stat-tile-sub dq-stat-sub-spaced">탭에서 압축기를 골라 그래프를 봅니다</div>
          </div>
        </div>

        <!-- 트렌드 — 툴바·그래프·채널 카드는 공통 컴포넌트(common/js/trend-view.js)가 그린다 -->
        <div class="panel">
          <div class="card-head">
            <h2 class="section-title">압축기 트렌드</h2>
            <div class="segmented" id="dqCompressorTabs"></div>
          </div>
          <div id="dqTrendView"></div>
        </div>

        <!-- 운전 상태 타임라인 — 같은 컴포넌트가 채운다 -->
        <div class="panel" id="dqTimeline"></div>

        <!-- 이벤트 — 공통 컴포넌트(common/js/event-log.js) -->
        <div class="panel dq-event-panel">
          <div class="card-head">
            <h2 class="section-title">이벤트 이력</h2>
            <div id="dqEventFilters"></div>
          </div>
          <div id="dqEventLog"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../common/js/config.js"></script>
  <script src="../../common/js/auth.js"></script>
  <script src="../../common/js/api.js"></script>
  <script src="../../common/js/channels.js"></script>
  <script src="../../common/js/ui.js"></script>
  <script src="../../common/js/layout.js"></script>
  <script src="../../common/js/vendor/chart.umd.min.js"></script>
  <script src="../../common/js/trend-view.js"></script>
  <script src="../../common/js/event-log.js"></script>
  <script src="trend.js"></script>
  <script>
    requireAuth();
    renderLayout();
  </script>
</body>
</html>
