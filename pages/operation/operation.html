<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>운전일지 - HRMS</title>
  <link rel="stylesheet" href="../../common/css/common.css" />
  <link rel="stylesheet" href="operation.css" />
  <link rel="stylesheet" href="../../common/css/pdf-export.css" />
</head>
<body data-page="operation">
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <main class="content content-narrow" id="content">
      <div class="page-header">
        <h1>운전일지</h1>
        <p>장비와 연/월을 선택하면 그 달의 날짜별 운전일지 결재 현황이 표시됩니다. 날짜 칸의 상태 버튼을 누르면 해당 일의 운전일지를 작성/조회할 수 있습니다.</p>
      </div>

      <div class="operation-grid">
        <aside class="operation-left">
          <div class="field">
            <label for="regionSelect">지역</label>
            <select id="regionSelect">
              <option value="">선택</option>
            </select>
          </div>
          <div class="field">
            <label for="buildingSelect">시설동</label>
            <select id="buildingSelect" disabled>
              <option value="">선택</option>
            </select>
          </div>
          <div class="field">
            <label for="equipmentSelect">설비</label>
            <select id="equipmentSelect" disabled>
              <option value="">선택</option>
            </select>
          </div>
          <div class="operation-left-divider"></div>
          <div class="field">
            <label for="yearSelect">년</label>
            <select id="yearSelect"></select>
          </div>
          <div class="field">
            <label for="monthSelect">월</label>
            <select id="monthSelect"></select>
          </div>
        </aside>

        <section class="operation-right">
          <div class="operation-selection-summary" id="selectionSummary">
            <span class="selection-placeholder">지역 · 시설동 · 설비를 선택하세요.</span>
          </div>

          <div class="panel">
            <div class="operation-month-nav">
              <button type="button" class="btn btn-secondary" id="prevMonthBtn" disabled>◀ 이전</button>
              <h2 id="calendarTitle">-</h2>
              <button type="button" class="btn btn-secondary" id="nextMonthBtn" disabled>다음 ▶</button>
            </div>
            <div class="table-scroll" id="calendarArea">
              <div class="empty-state">좌측에서 지역 · 시설동 · 설비를 선택하세요.</div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 운전일지 레포트 모달 -->
  <div class="modal-overlay" id="operationModal" hidden>
    <div class="modal-box operation-modal-box">
      <div class="modal-header operation-modal-header">
        <span class="operation-modal-eyebrow">Operation Report</span>
        <button type="button" class="modal-close-btn" id="modalCloseX" aria-label="닫기">×</button>
      </div>
      <div class="modal-body operation-modal-body" id="modalBody">
        <div class="empty-state">불러오는 중...</div>
      </div>
    </div>
  </div>

  <!-- 실측 기준 수정 팝업 -->
  <div class="modal-overlay" id="refEditModal" hidden>
    <div class="modal-box ref-edit-modal-box">
      <div class="modal-header">실측 기준 수정</div>
      <div class="modal-body">
        <p class="ref-edit-item-label" id="refEditItemLabel"></p>
        <textarea id="refEditTextarea" class="ref-edit-textarea" rows="4" placeholder="실측 기준을 입력하세요."></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="refEditCancelBtn">취소</button>
        <button type="button" class="btn btn-primary" id="refEditSaveBtn">저장</button>
      </div>
    </div>
  </div>

  <script src="../../common/js/config.js"></script>
  <script src="../../common/js/auth.js"></script>
  <script src="../../common/js/api.js"></script>
  <script src="../../common/js/channels.js"></script>
  <script src="../../common/js/ui.js"></script>
  <script src="../../common/js/approval.js"></script>
  <script src="../../common/js/pdf-export.js"></script>
  <script src="../../common/js/approval-inbox.js"></script>
  <script src="../../common/js/layout.js"></script>
  <script src="operation.js"></script>
  <script>
    requireAuth();
    renderLayout();
  </script>
</body>
</html>
