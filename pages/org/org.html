<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>조직 관리 - HRMS</title>
  <link rel="stylesheet" href="../../common/css/common.css" />
  <link rel="stylesheet" href="org.css" />
</head>
<body data-page="org">
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <main class="content content-narrow" id="content">
      <div class="page-header page-header-row">
        <div>
          <span class="page-eyebrow">Organization</span>
          <h1>조직 관리</h1>
          <p>선임된 안전관리 인원을 담당업무 단계별로 보여줍니다.</p>
        </div>
        <!-- 시스템관리자에게만 보인다 -->
        <button type="button" class="btn btn-primary org-manage-btn" id="orgManageBtn" hidden>관리</button>
      </div>

      <div class="org-error" id="orgError" hidden></div>

      <div class="org-chart" id="orgChart">
        <div class="empty-state">불러오는 중...</div>
      </div>
    </main>
  </div>

  <!-- ===== 세부정보 팝업 (누구나) ===== -->
  <div class="modal-overlay" id="orgDetailModal" hidden>
    <div class="modal-box org-detail-box" role="dialog" aria-modal="true">
      <div class="modal-header org-modal-header">
        <div>
          <span class="org-modal-eyebrow">Member</span>
          <h2 class="org-modal-title" id="orgDetailTitle">세부정보</h2>
        </div>
        <button type="button" class="modal-close-btn" data-close-detail aria-label="닫기">×</button>
      </div>
      <div class="modal-body org-detail-body">
        <table class="org-detail-table">
          <tbody id="orgDetailRows"></tbody>
        </table>
        <div class="org-section-title">담당장비 <em id="orgDetailEquipCount">0대</em></div>
        <div class="org-equip-groups" id="orgDetailEquipments"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close-detail>닫기</button>
      </div>
    </div>
  </div>

  <!-- ===== 인원 관리 모달 (시스템관리자) — 좌: 인원 목록 / 우: 선택한 인원 정보·수정·신규 작성 ===== -->
  <div class="modal-overlay" id="orgManageModal" hidden>
    <div class="modal-box om-box" role="dialog" aria-modal="true">
      <div class="modal-header org-modal-header">
        <div>
          <span class="org-modal-eyebrow">Members</span>
          <h2 class="org-modal-title">인원 관리</h2>
        </div>
        <button type="button" class="modal-close-btn" id="omCloseX" aria-label="닫기">×</button>
      </div>

      <div class="om-split">
        <div class="om-left">
          <button type="button" class="btn btn-primary om-new-btn" id="omNewBtn">+ 신규 인원</button>
          <input type="search" class="om-search" id="omSearch" placeholder="이름 검색" />
          <label class="om-check-label">
            <input type="checkbox" id="omShowInactive" />
            비활성 인원 포함
          </label>
          <ul class="om-list" id="omList"></ul>
        </div>

        <div class="om-right">
          <div class="empty-state om-right-empty" id="omEmpty">왼쪽 목록에서 인원을 고르거나 "+ 신규 인원"을 누르세요.</div>

          <form class="om-form" id="omForm" hidden autocomplete="off">
            <!-- 계정 -->
            <section class="om-sec">
              <h3 class="om-sec-title">계정</h3>
              <div class="om-grid">
                <div class="om-field">
                  <label for="omUsername">사용자 ID<i class="om-req" id="omUsernameReq">*</i></label>
                  <div class="om-inline">
                    <input type="text" id="omUsername" maxlength="50" />
                    <button type="button" class="btn btn-secondary om-inline-btn" id="omCheckBtn">중복확인</button>
                  </div>
                  <p class="om-hint" id="omUsernameHint"></p>
                </div>

                <!-- 신규: 비밀번호 두 번 입력 / 수정: 초기화 버튼 -->
                <div class="om-field om-new-only">
                  <label for="omPassword">비밀번호<i class="om-req">*</i></label>
                  <input type="password" id="omPassword" autocomplete="new-password" />
                </div>
                <div class="om-field om-new-only">
                  <label for="omPasswordConfirm">비밀번호 확인<i class="om-req">*</i></label>
                  <input type="password" id="omPasswordConfirm" autocomplete="new-password" />
                </div>

                <div class="om-field om-edit-only">
                  <label>비밀번호</label>
                  <button type="button" class="btn btn-secondary om-full-btn" id="omResetPwBtn">비밀번호 초기화</button>
                </div>
                <div class="om-field om-edit-only">
                  <label>계정 상태</label>
                  <div class="segmented om-seg" id="omActiveSeg">
                    <button type="button" class="segmented-btn" data-value="true">활성</button>
                    <button type="button" class="segmented-btn" data-value="false">비활성</button>
                  </div>
                </div>
              </div>
              <p class="om-warn" id="omInactiveWarn" hidden>
                비활성화하면 이 계정으로 로그인할 수 없습니다. 다만 이미 로그인해 있는 경우 최대 12시간 동안은 계속 사용할 수 있습니다.
              </p>
            </section>

            <!-- 인적사항 -->
            <section class="om-sec">
              <h3 class="om-sec-title">인적사항</h3>
              <div class="om-grid">
                <div class="om-field">
                  <label for="omFullName">성명<i class="om-req">*</i></label>
                  <input type="text" id="omFullName" maxlength="50" />
                </div>
                <div class="om-field">
                  <label for="omDepartment">소속팀</label>
                  <input type="text" id="omDepartment" maxlength="100" />
                </div>
                <div class="om-field">
                  <label for="omPosition">직위</label>
                  <input type="text" id="omPosition" maxlength="50" />
                </div>
                <div class="om-field">
                  <label for="omRole">담당업무<i class="om-req">*</i></label>
                  <select id="omRole" class="om-select">
                    <option value="">선택</option>
                    <option value="안전관리총괄자">안전관리총괄자</option>
                    <option value="안전관리책임자">안전관리책임자</option>
                    <option value="안전관리원">안전관리원</option>
                    <option value="일반관리원">일반관리원</option>
                  </select>
                </div>
                <div class="om-field">
                  <label for="omPhone1">연락처1</label>
                  <input type="text" id="omPhone1" maxlength="30" />
                </div>
                <div class="om-field">
                  <label for="omPhone2">연락처2</label>
                  <input type="text" id="omPhone2" maxlength="30" />
                </div>
                <div class="om-field">
                  <label for="omBackup">대직자</label>
                  <input type="text" id="omBackup" maxlength="50" />
                </div>
                <div class="om-field">
                  <label>선임여부</label>
                  <div class="segmented om-seg" id="omAppointedSeg">
                    <button type="button" class="segmented-btn" data-value="true">선임</button>
                    <button type="button" class="segmented-btn" data-value="false">미선임</button>
                  </div>
                </div>
                <div class="om-field">
                  <label>선해임 신고서</label>
                  <div class="om-report" id="omReport"></div>
                  <p class="om-hint" id="omReportHint"></p>
                  <input type="file" id="omReportFile" hidden />
                </div>
                <div class="om-field">
                  <label for="omLegalDate">법정교육일</label>
                  <input type="date" id="omLegalDate" />
                </div>
                <div class="om-field">
                  <label for="omNextDate">차기교육일</label>
                  <input type="date" id="omNextDate" />
                </div>
              </div>
              <p class="om-warn" id="omRoleWarn" hidden>담당업무를 바꾸면 결재 권한도 함께 바뀝니다.</p>
            </section>

            <!-- 담당장비 -->
            <section class="om-sec">
              <div class="om-sec-head">
                <h3 class="om-sec-title">담당장비</h3>
                <span class="om-equip-count" id="omEquipCount">선택 0대</span>
                <!-- 전체 선택/해제 — 검색 중이면 검색 결과에 보이는 장비만 대상 -->
                <button type="button" class="om-equip-all" id="omEquipAll">
                  <span class="om-cb" id="omEquipAllCb"></span><span id="omEquipAllLabel">전체 선택</span>
                </button>
                <input type="search" class="om-search om-equip-search" id="omEquipSearch" placeholder="장비명·시설동 검색" />
              </div>
              <div class="om-equip-groups" id="omEquipGroups"></div>
            </section>
          </form>
        </div>
      </div>

      <div class="modal-footer om-footer">
        <div class="om-footer-msg">
          <span class="om-footer-error" id="omError" hidden></span>
          <span class="om-footer-ok" id="omOk" hidden></span>
        </div>
        <button type="button" class="btn btn-secondary" id="omCloseBtn">닫기</button>
        <button type="button" class="btn btn-primary" id="omSaveBtn" disabled>저장</button>
      </div>
    </div>
  </div>

  <!-- ===== 비밀번호 초기화 ===== -->
  <div class="modal-overlay org-pw-overlay" id="orgPwModal" hidden>
    <div class="modal-box org-pw-box" role="dialog" aria-modal="true">
      <div class="modal-header">비밀번호 초기화 <span class="org-pw-target" id="orgPwTarget"></span></div>
      <div class="modal-body">
        <div class="om-field">
          <label for="orgPwNew">새 비밀번호</label>
          <input type="password" id="orgPwNew" autocomplete="new-password" />
        </div>
        <div class="om-field" style="margin-top: 10px">
          <label for="orgPwConfirm">새 비밀번호 확인</label>
          <input type="password" id="orgPwConfirm" autocomplete="new-password" />
        </div>
        <p class="om-hint om-hint-error" id="orgPwError" hidden></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="orgPwCancel">취소</button>
        <button type="button" class="btn btn-primary" id="orgPwSave">변경</button>
      </div>
    </div>
  </div>

  <script src="../../common/js/config.js"></script>
  <script src="../../common/js/auth.js"></script>
  <script src="../../common/js/api.js"></script>
  <script src="../../common/js/ui.js"></script>
  <script src="../../common/js/attachments.js"></script>
  <script src="../../common/js/approval-inbox.js"></script>
  <script src="../../common/js/layout.js"></script>
  <script src="org.js"></script>
  <script>
    requireAuth();
    renderLayout();
  </script>
</body>
</html>
