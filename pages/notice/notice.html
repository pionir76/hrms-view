<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공지사항 - HRMS</title>
  <link rel="stylesheet" href="../../common/css/common.css" />
  <link rel="stylesheet" href="notice.css" />
</head>
<body data-page="notice">
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>
    <main class="content content-narrow" id="content">
      <div>
        <div class="page-header nt-page-header">
          <div>
            <h1>공지사항</h1>
            <p>전사 공지를 등록하고 조회합니다. 목록에서 제목을 누르면 내용을 보거나 편집할 수 있습니다.</p>
          </div>
          <button type="button" class="btn btn-primary" id="ntAddNewBtn">+ 신규작성</button>
        </div>

        <div class="panel">
          <div class="table-scroll">
            <table class="data-table table-hover nt-table">
              <colgroup>
                <col style="width: 80px" />
                <col />
                <col style="width: 130px" />
                <col style="width: 130px" />
                <col style="width: 80px" />
              </colgroup>
              <thead>
                <tr>
                  <th>순번</th>
                  <th>제목</th>
                  <th>작성자</th>
                  <th>작성일</th>
                  <th>첨부</th>
                </tr>
              </thead>
              <tbody id="ntListBody">
                <tr><td colspan="5"><div class="empty-state">불러오는 중...</div></td></tr>
              </tbody>
            </table>
          </div>
          <div class="pager" id="ntPager" hidden></div>
        </div>
      </div>
    </main>
  </div>

  <!-- 공지사항 상세/신규작성 모달 -->
  <div class="modal-overlay" id="noticeModal" hidden>
    <div class="modal-box nt-modal-box">
      <div class="modal-header nt-modal-header">
        <div>
          <span class="nt-modal-eyebrow">Notice</span>
          <h2 class="nt-modal-title">공지사항</h2>
        </div>
        <button type="button" class="modal-close-btn" id="ntModalCloseX" aria-label="닫기">×</button>
      </div>

      <div class="modal-body">
        <div id="ntDetailForm">
          <div class="nt-meta">
            <span class="nt-meta-author" id="ntMetaAuthor"></span>
            <span class="nt-meta-date" id="ntMetaDate"></span>
          </div>

          <table class="nt-form-table">
            <colgroup>
              <col style="width: 16%" />
              <col />
            </colgroup>
            <tbody>
              <tr>
                <th>제목</th>
                <td><input type="text" id="ntTitle" /></td>
              </tr>
              <tr class="nt-content-row">
                <th>내용</th>
                <td><textarea id="ntContent"></textarea></td>
              </tr>
            </tbody>
          </table>

          <div class="field nt-attachment-field">
            <label class="nt-attach-label">첨부파일<span class="nt-attach-limit" id="ntAttachmentLimitHint" hidden>최대 크기 10MB</span></label>
            <div class="attachment-list" id="ntAttachmentList"></div>
            <label class="btn btn-secondary nt-attachment-upload-btn" id="ntAttachmentUploadLabel">
              파일 추가
              <input type="file" multiple id="ntAttachmentInput" hidden />
            </label>
            <p class="nt-form-note" id="ntAttachmentNewNotice" hidden>선택한 파일은 저장 시 함께 등록됩니다.</p>
          </div>

          <p class="nt-audit" id="ntAuditInfo"></p>
        </div>
      </div>

      <!-- 안내/에러 문구를 폼 안에 두면 나타날 때마다 폼이 밀려서, 버튼 좌측 고정 영역에 표시한다 -->
      <div class="modal-footer nt-footer">
        <button type="button" class="nt-pin-toggle" id="ntPinBtn" hidden aria-pressed="false">
          <span class="nt-pin-icon" id="ntPinIcon">📌</span><span id="ntPinLabel">상단 고정</span>
        </button>
        <div class="nt-footer-msg">
          <span class="nt-footer-error" id="ntModalError" hidden></span>
          <span class="nt-footer-note" id="ntLockNotice" hidden></span>
        </div>
        <div class="nt-footer-actions">
          <button type="button" class="btn btn-danger" id="ntDeleteBtn" hidden>삭제</button>
          <button type="button" class="btn btn-secondary" id="ntCancelBtn">닫기</button>
          <button type="button" class="btn btn-primary" id="ntSaveBtn">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../common/js/config.js"></script>
  <script src="../../common/js/auth.js"></script>
  <script src="../../common/js/api.js"></script>
  <script src="../../common/js/ui.js"></script>
  <script src="../../common/js/attachments.js"></script>
  <script src="../../common/js/approval-inbox.js"></script>
  <script src="../../common/js/layout.js"></script>
  <script src="notice.js"></script>
  <script>
    requireAuth();
    renderLayout();
  </script>
</body>
</html>
