<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>실시간 측정값 시안 v2</title>
<link rel="stylesheet" href="../common/css/common.css" />
<link rel="stylesheet" href="../pages/dashboard/dashboard.css" />
<style>
  /* 시안 v2 — B안(한 장 넓은 표). 열 순서: 시설동 · 장비명 · 압축기 · 운전정보 · 경보상태 · 센서 7개 · IP 주소 · 통신상태 (2026-10-27, 순번 제거·통신 정상/불능 배지) */
  body { width: 1640px; padding: 20px 24px; background: var(--color-bg); }
  .mk-cap { margin: 0 0 10px; font-size: 13px; font-weight: 800; color: #002c5f; }
  .mk-cap small { margin-left: 8px; font-weight: 500; color: var(--color-text-muted); }
  .db-list { height: 900px; display: flex; flex-direction: column; }

  .vv-switch { display: inline-flex; padding: 3px; border-radius: 10px; background: #eef1f6; flex-shrink: 0; }
  .vv-switch button {
    border: none; background: none; padding: 5px 12px; border-radius: 8px;
    font: inherit; font-size: 12.5px; font-weight: 700; color: var(--color-text-muted); cursor: pointer; white-space: nowrap;
  }
  .vv-switch button.on { background: #fff; color: var(--color-brand-navy); box-shadow: 0 1px 3px rgba(20, 32, 60, 0.12); }

  .vv-wrap { flex: 1; min-height: 0; overflow: auto; }
  .vv-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  .vv-table th {
    position: sticky; top: 0; z-index: 2; padding: 9px 10px; background: #f8f9fc;
    border-bottom: 1px solid var(--color-border); font-size: 11.5px; font-weight: 700;
    color: var(--color-text-sub); text-align: right; white-space: nowrap;
  }
  .vv-table th small { margin-left: 3px; font-size: 10.5px; font-weight: 600; color: var(--color-text-faint); }
  .vv-table th.l { text-align: left; }
  .vv-table th.c { text-align: center; }
  .vv-table td { padding: 5px 10px; border-bottom: 1px solid var(--color-border-soft); white-space: nowrap; }
  .vv-table td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .vv-table td.c { text-align: center; }
  .vv-table td.ip { font-variant-numeric: tabular-nums; color: var(--color-text-sub); font-size: 12.5px; }
  .vv-table tr.vv-region td { padding: 9px 10px 7px; background: #f3f5fa; font-size: 13.5px; font-weight: 800; border-bottom: 1px solid var(--color-border); }
  .vv-table tr.vv-region td em { margin-left: 8px; font-style: normal; font-size: 12px; font-weight: 600; color: var(--color-text-muted); }
  .vv-table td.vv-no { color: var(--color-text-faint); font-size: 12px; text-align: center; vertical-align: top; }
  .vv-table td.vv-bld { font-size: 12px; font-weight: 800; color: #2f5bea; vertical-align: top; }
  .vv-table td.vv-eqname { vertical-align: top; font-weight: 600; }
  .vv-table tr.vv-first td { border-top: 1px solid var(--color-border-soft); }
  .vv-table tbody tr:not(.vv-region):hover td:not(.vv-bld):not(.vv-eqname):not(.vv-no) { background: #f5f8ff; }

  .vv-seq {
    display: inline-grid; place-items: center; min-width: 30px; height: 18px; padding: 0 5px;
    border-radius: 5px; background: #eaeef4; box-shadow: inset 0 0 0 1px #d4dbe6;
    font-size: 10.5px; font-weight: 800; color: #6a7489; font-variant-numeric: tabular-nums;
  }
  .vv-seq.alarm { background: #e0364d; box-shadow: none; color: #fff; }
  .vv-seq.comm { background: #f79009; box-shadow: none; color: #fff; }
  .vv-tag { display: inline-block; min-width: 38px; padding: 1px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 800; text-align: center; }
  .vv-tag.run { background: #e6f7f1; color: #0f9467; }
  .vv-tag.stop { background: #eef1f6; color: #6a7489; }
  .vv-tag.alarm { background: #e0364d; color: #fff; }
  .vv-tag.normal { background: #f1f3f8; color: #8a93a6; }
  .vv-tag.unknown { background: #f1f3f8; color: #c3c9d5; }
  .vv-tag.ok { background: #eef3ff; color: #2f5bea; }
  .vv-tag.fail { background: #fff3e0; color: #c25e00; }
  .vv-alarmv span { padding: 1px 5px; border-radius: 5px; background: #ffe8eb; color: #c4142c; font-weight: 800; }
  .vv-comm td.num { color: #b5bccb; }
</style>
</head>
<body>
  <p class="mk-cap">B안 v2 — 한 장 넓은 표<small>열 순서: 시설동 · 장비명 · 압축기 · 운전정보 · 경보상태 · 센서 7개(우리 화면 순서) · IP 주소 · 통신상태(정상/불능) / 3초 갱신</small></p>
  <div class="db-card db-list">
    <div class="db-list-bar">
      <h2 class="db-list-title">장비 리스트</h2>
      <div class="vv-switch"><button type="button">장비 운영 상태</button><button type="button" class="on">실시간 측정값</button></div>
      <div class="db-filters">
        <button type="button" class="db-fchip active">전체<em>149</em></button>
        <button type="button" class="db-fchip d-run"><i></i>운전<em>148</em></button>
        <button type="button" class="db-fchip d-stop"><i></i>정지<em>1</em></button>
        <button type="button" class="db-fchip d-comm"><i></i>통신 불량<em>1</em></button>
        <button type="button" class="db-fchip d-alarm"><i></i>경보<em>2</em></button>
      </div>
      <input type="search" class="db-search" placeholder="장비명·시설동 검색" />
    </div>
    <div class="vv-wrap" id="body"></div>
  </div>
<script>
  const SENSORS = [
    ["토출압력", "MPa", 2], ["토출온도", "℃", 1], ["흡입압력", "MPa", 2], ["흡입온도", "℃", 1],
    ["오일압력", "MPa", 2], ["오일온도", "℃", 1], ["운전전류", "A", 1],
  ];
  const DATA = {
    "A 지구": [
      ["차량시험동", [["수밀챔버 #1", 1], ["시트컴포트(저온)&HOT챔버", 2], ["저온챔버 #1", 1], ["BSR #2", 2]]],
      ["PDI 1동", [["실차환경챔버 #2", 2]]],
      ["PT 배기환경시험동", [["인증환경챔버 #1", 1], ["인증환경챔버 #3", 1]]],
    ],
    "B 지구": [
      ["강설시험동", [["강설강우풍동 #1", 1], ["소크룸#2", 1]]],
      ["배기1동", [["소크룸 #1", 1], ["소크룸 #2", 1], ["환경챔버 #1", 1]]],
    ],
    "C 지구": [["무향3동", [["무향실", 5]]], ["배기3동", [["시험실 #1", 1]]]],
  };
  let seed = 11;
  const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const BASE = [2.1, 62, 0.42, 4.5, 2.6, 41, 32];
  const SPREAD = [0.5, 25, 0.2, 12, 0.6, 12, 18];
  let ip = 200;
  let no = 0;
  const rows = Object.entries(DATA).map(([region, blds]) => {
    const n = blds.reduce((k, b) => k + b[1].length, 0);
    return `<tr class="vv-region"><td colspan="14">${region}<em>${n}대 · 시설동 ${blds.length}</em></td></tr>` + blds.map(([bld, eqs]) => {
      const all = eqs.map(([name, k]) => ({ no: ++no, name, comps: Array.from({ length: k }, (_, i) => i + 1) }));
      const bldRows = all.reduce((k, e) => k + e.comps.length, 0);
      return all.map((e, ei) => {
        const comm = e.name === "인증환경챔버 #3";
        const stop = e.name === "저온챔버 #1";
        return e.comps.map((seq, ci) => {
          const alarmCh = e.name === "소크룸 #2" ? 1 : e.name === "무향실" && seq === 4 ? 6 : -1;
          const alarm = alarmCh >= 0;
          const vals = SENSORS.map((s, k) => {
            const v = stop && k === 6 ? "0.0" : (BASE[k] + (rnd() - 0.5) * SPREAD[k]).toFixed(s[2]);
            return `<td class="num${k === alarmCh ? " vv-alarmv" : ""}"><span>${v}</span></td>`;
          }).join("");
          return `<tr class="${ci === 0 ? "vv-first" : ""}${comm ? " vv-comm" : ""}">
            ${ei === 0 && ci === 0 ? `<td class="vv-bld" rowspan="${bldRows}">${bld}</td>` : ""}
            ${ci === 0 ? `<td class="vv-eqname" rowspan="${e.comps.length}">${e.name}</td>` : ""}
            <td><span class="vv-seq${comm ? " comm" : alarm ? " alarm" : ""}">#${seq}</span></td>
            <td class="c"><span class="vv-tag ${stop ? "stop" : "run"}">${stop ? "정지" : "운전"}</span></td>
            <td class="c">${comm ? `<span class="vv-tag unknown" title="통신이 끊겨 알 수 없음">?</span>` : `<span class="vv-tag ${alarm ? "alarm" : "normal"}">${alarm ? "경보" : "정상"}</span>`}</td>
            ${vals}
            <td class="ip">10.20.193.${ip++}</td>
            <td class="c"><span class="vv-tag ${comm ? "fail" : "ok"}">${comm ? "불능" : "정상"}</span></td>
          </tr>`;
        }).join("");
      }).join("");
    }).join("");
  }).join("");
  document.getElementById("body").innerHTML = `<table class="vv-table">
    <thead><tr>
      <th class="l">시설동</th><th class="l">장비명</th><th class="l">압축기</th>
      <th class="c">운전정보</th><th class="c">경보상태</th>
      ${SENSORS.map((s) => `<th>${s[0]}<small>${s[1]}</small></th>`).join("")}
      <th class="l">IP 주소</th><th class="c">통신상태</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
</script>
</body>
</html>
