<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>압축기 램프 시안</title>
<link rel="stylesheet" href="../common/css/common.css" />
<link rel="stylesheet" href="../pages/dashboard/dashboard.css" />
<style>
  body { width: 1500px; padding: 24px; background: var(--color-bg, #f4f6fb); }
  .wrap { display: grid; grid-template-columns: 520px 390px 360px; gap: 28px; align-items: start; }
  .cap { margin: 0 0 10px; font-size: 13px; font-weight: 800; color: #002c5f; }
  .cap small { display: block; margin-top: 2px; font-weight: 500; color: var(--color-text-muted); }
  .col { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; }
  .col .db-region { border-right: none; }

  /* ===== 시안: 압축기 램프 ===== */
  .db-lamps { flex-shrink: 0; display: inline-flex; gap: 3px; }
  .db-lamp {
    width: 17px; height: 17px; display: grid; place-items: center;
    border-radius: 4px; background: #eaeef4; box-shadow: inset 0 0 0 1px #d4dbe6;
    font-size: 9.5px; font-weight: 800; color: #8a93a6; font-variant-numeric: tabular-nums;
  }
  .db-lamp.alarm { background: #e0364d; box-shadow: none; color: #fff; }
  .db-lamp.comm { background: #f79009; box-shadow: none; color: #fff; }
  /* 좁은 화면(1366 등) — 숫자 없는 점 */
  .narrow .db-lamp { width: 8px; height: 8px; border-radius: 50%; font-size: 0; }
  .narrow .db-lamps { gap: 3px; }

  /* 툴팁 시늉 */
  .tipdemo { position: relative; }
  .tipdemo::after { content: "#2 통신 끊김 — 경보 여부 알 수 없음"; position: absolute; left: 50%; top: 22px; transform: translateX(-50%); white-space: nowrap; padding: 4px 8px; border-radius: 6px; background: rgba(23,32,51,.9); color: #fff; font-size: 11px; font-weight: 600; z-index: 3; }

  /* 맵 팝업 행의 램프(이름 아래 줄) */
  .db-map-pop { position: static; width: 340px; }
  .db-map-pop li .nm .db-lamps { margin-top: 4px; }

  .legend { margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--color-border-strong); border-radius: 10px; background: #fff; font-size: 12px; line-height: 1.8; color: var(--color-text-sub); }
  .legend .db-lamp { display: inline-grid; vertical-align: -3px; margin-right: 4px; }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
  const EQ = [
    { b: "차량시험동", items: [
      { name: "저온챔버", run: true, comps: ["ok", "alarm"] },
      { name: "수밀챔버", run: false, comps: ["ok", "comm"] },
      { name: "시트컴포트(저온)&HOT챔버", run: true, comps: ["ok", "ok"] },
      { name: "BSR 2기 챔버", run: false, comps: ["ok", "ok"] },
    ]},
    { b: "PT배기환경시험동", items: [
      { name: "인증환경챔버&쇼크룸", run: true, comps: ["ok", "ok", "alarm", "ok", "ok", "ok"] },
    ]},
    { b: "PDI 1동", items: [
      { name: "센츄리 냉동기(2층)", run: false, comps: ["comm", "comm", "comm"] },
      { name: "실차환경챔버 1차", run: true, comps: ["ok"] },
    ]},
  ];
  const label = { ok: "정상", alarm: "경보", comm: "통신 끊김" };
  let tipUsed = false;
  const lamps = (cs, tip) => `<span class="db-lamps">${cs.map((c, i) => `<span class="db-lamp ${c === "ok" ? "" : c}${tip && i === 1 && c === "comm" && !tipUsed && (tipUsed = true) ? " tipdemo" : ""}" title="#${i + 1} ${label[c]}">${i + 1}</span>`).join("")}</span>`;
  const row = (e, tip) => {
    const comm = e.comps.includes("comm"), alarm = e.comps.includes("alarm");
    const dot = comm ? "d-comm" : e.run ? "d-run run" : "d-stop";
    return `<div class="db-eq"><span class="db-dot ${dot}"></span><span class="db-eq-name">${e.name}</span>${lamps(e.comps, tip)}<span class="db-onoff comm${comm ? " on" : ""}">통신</span><span class="db-onoff alarm${alarm && !comm ? " on" : ""}${comm ? " unknown" : ""}">경보</span></div>`;
  };
  const region = (tip) => `<div class="db-region"><div class="db-region-head"><b>A지구</b><span class="db-region-cnt">7대 · 시설동 3</span>
      <span class="db-region-mini"><span class="d-run"><i></i>운전<b>3</b></span><span class="d-comm"><i></i>통신<b>2</b></span><span class="d-alarm"><i></i>경보<b>2</b></span></span></div>
      <div class="db-region-body">${EQ.map((g) => `<div class="db-bld"><div class="db-bld-head">${g.b}<em>${g.items.length}</em></div>${g.items.map((e) => row(e, tip)).join("")}</div>`).join("")}</div></div>`;
  const tags = (e) => {
    const comm = e.comps.includes("comm"), alarm = e.comps.includes("alarm");
    if (comm) return `<span class="t s-comm">통신오류</span>`;
    return (alarm ? `<span class="t s-alarm">경보</span>` : "") + (e.run ? `<span class="t s-run">운전</span>` : `<span class="t s-idle">정지</span>`);
  };
  const st = (e) => (e.comps.includes("alarm") && !e.comps.includes("comm") ? "alarm" : e.comps.includes("comm") ? "comm" : e.run ? "run" : "idle");
  const pop = `<div class="db-map db-map-pop" style="display:block"><div class="db-map-pop-h"><span class="db-map-pop-no">A-6</span><b>차량시험동</b><button class="db-map-pop-x">×</button></div>
    <div class="db-map-pop-sum"><span class="s-alarm"><i></i>경보·비상정지 1</span><span class="s-comm"><i></i>통신오류 1</span><span class="s-run"><i></i>운전 1</span><span class="s-idle"><i></i>정지 1</span></div>
    <ul>${EQ[0].items.slice().sort((a, b) => ["alarm", "comm", "run", "idle"].indexOf(st(a)) - ["alarm", "comm", "run", "idle"].indexOf(st(b))).map((e) => `<li><span class="d c-${st(e)}"></span><span class="nm"><b>${e.name}</b>${lamps(e.comps)}</span><span class="tags">${tags(e)}</span><span class="chev">›</span></li>`).join("")}</ul>
    <div class="db-map-pop-f">장비를 누르면 장비 실시간 화면으로 이동합니다</div></div>`;
  document.getElementById("root").innerHTML = `
    <div><p class="cap">① 리스트 — 1600px 이상<small>장비명 · 압축기 램프(순번) · 통신 · 경보</small><div class="col">${region(true)}</div>
      <div class="legend"><span class="db-lamp alarm">2</span>경보 &nbsp; <span class="db-lamp comm">2</span>통신 끊김(경보 알 수 없음) &nbsp; <span class="db-lamp">1</span>정상<br>· 압축기별 운전 정보가 없어 정상은 초록이 아닌 회청색<br>· 마우스를 올리면 "#2 통신 끊김" 안내</div></div>
    <div class="narrow"><p class="cap">② 리스트 — 좁은 화면(1366 등)<small>램프를 숫자 없는 점으로 줄여 장비명 자리 확보</small><div class="col">${region(false)}</div></div>
    <div><p class="cap">③ 맵 팝업<small>"압축기 N대" 글자 → 압축기 수만큼 램프</small>${pop}</div>`;
</script>
</body>
</html>
