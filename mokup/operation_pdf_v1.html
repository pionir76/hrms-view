<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>운전일지 PDF 시안</title>
<link rel="stylesheet" href="../common/css/common.css" />
<link rel="stylesheet" href="../common/css/pdf-export.css" />
<style>
  /* 화면에서 볼 때: A4 폭(180mm 본문)으로 문서를 나란히 */
  @media screen {
    body { background: #e9edf3; padding: 28px; }
    #pdfPrintRoot { display: flex !important; gap: 32px; align-items: flex-start; }
    .pdf-doc { width: 680px; padding: 40px; background: #fff; box-shadow: 0 6px 24px -8px rgba(16,24,40,.25); box-sizing: content-box; }
  }
  @media print {
    .pdf-doc + .pdf-doc { break-before: page; }
  }

  /* ===== 시안: 운전일지(세로) 표 ===== */
  .op-pdf-table th { padding: 5px 4px; font-size: 10.5px; }
  .op-pdf-table td { padding: 4px 5px; font-size: 11px; text-align: center; vertical-align: middle; white-space: normal; }
  .op-pdf-table td.op-l { text-align: center; font-weight: 600; color: var(--color-text-sub); }
  .op-pdf-table td.op-ref { text-align: left; font-size: 9.5px; line-height: 1.45; color: var(--color-text-muted); }
  .op-pdf-table td.op-val { font-variant-numeric: tabular-nums; }
  .op-pdf-table td.op-note { text-align: left; font-size: 9.5px; line-height: 1.55; color: var(--color-text-muted); }
  .op-pdf-table .ox-toggle-btn { width: 20px; height: 20px; border-radius: 5px; }
  .op-pdf-table .ox-toggle-btn .ox-icon { width: 14px; height: 14px; }
  /* 계통(구분) 단위로 쪽이 나뉘게 — 단, 한 쪽보다 긴 계통(압축기가 많은 냉매계통)은 행 단위로 나뉜다 */
  .op-pdf-table tbody.op-keep { break-inside: avoid; }
  .op-pdf-table td.op-sub { white-space: nowrap; font-size: 10.5px; }
  .op-printed { margin-top: 6px; text-align: right; font-size: 10px; color: var(--color-text-muted); }
</style>
</head>
<body class="is-pdf-printing">
<div id="pdfPrintRoot"></div>
<script src="../common/js/ui.js"></script>
<script>
  const SLOTS = ["09:00", "13:00", "16:00", "21:00"];
  const CATALOG = [
    { division: "냉매계통", eq: "육안/온도계·누설감지기<br>모니터링시스템", items: [
      { label: "토출압력", per: true, ref: "1.8MPa 이하", v: ["1.52", "1.55", "1.54", "1.49"] },
      { label: "토출가스온도", per: true, ref: "80℃ 이하", v: ["71.2", "73.8", "72.5", "70.9"] },
      { label: "흡입압력", per: true, ref: "-0.05MPa 이상", v: ["0.12", "0.11", "0.12", "0.13"] },
      { label: "냉매량", ox: true, ref: "액면계에서 액면이 보일 것 (100% 부하 운전중 중심선 위치)" },
      { label: "오일량", ox: true, ref: "운전중: 유면계에서 하단 중심선 이상 (가동전: 상한선에 위치)" },
      { label: "오일압력", per: true, ref: "-", v: ["0.42", "0.41", "0.43", "0.42"] },
    ]},
    { division: "냉수/냉각수계통", eq: "온도계/모니터링시스템", items: [
      { label: "냉각수온도", pair: ["입구", "출구"], ref: "-", v: [["28.1", "28.4", "28.9", "27.6"], ["32.4", "32.9", "33.1", "31.8"]] },
      { label: "브라인온도", pair: ["입구", "출구"], ref: "50℃ 이하", v: [["-12.1", "-12.4", "-12.2", "-11.9"], ["-9.8", "-10.1", "-9.9", "-9.6"]] },
    ]},
    { division: "전기계통", eq: "클램프메타<br>모니터링시스템", items: [
      { label: "운전전압(V)", ref: "정격전압 ±10% (RS,ST,TR상)", v: ["381", "379", "383", "380"] },
      { label: "운전전류(A)", ref: "기계 전류 ±10% (R,S,T상)", v: ["42.5", "44.1", "43.7", "41.9"] },
      { label: "단자대&판넬상태<br>(비가동시점검)", ox: true, ref: "느슨, 과열흔적, 먼지 등 청소상태" },
    ]},
    { division: "기타", eq: "육안", items: [
      { label: "드레인상태<br>(비가동시기 점검)", ox: true, ref: "동파 우려될 경우 냉수·냉각수 계통 물 배수 확인" },
      { label: "저압부 단열재상태<br>(비가동시기 점검)", ox: true, ref: "열손실이 없도록 보냉, 방습이 충분할 것" },
      { label: "이상진동 및 소음상태", ox: true, ref: "이상 진동, 소음이 없을 것" },
    ]},
  ];
  const OX = [["O", "O", "/", "O"], ["O", "X", "O", "O"], ["O", "O", "O", "/"]];
  const NOTE = "주: 1. 불필요 항목에는 \"해당없음(/)\"으로 표시<br />2. 각 점검내용에 대한 세부점검 내용은 사업자가 업소실정에 적정하게 작성하여야 함.<br />3. 전기설비의 방폭 가연성가스중 암모니아, 브롬화메탄, 공기중자기발화가스는 제외<br />4. 안전관리총괄자의 결재가 통상적으로 곤란할 경우 사업소의 자체 위임 전결규정에 따를 수 있다. 이하 기타 일지도 동일하게 적용한다.";

  const ox = (v) => `<span class="ox-toggle-btn ${oxCellClass(v)}">${oxToggleSymbol(v)}</span>`;
  const vals = (arr) => arr.map((x) => `<td class="op-val">${x}</td>`).join("");

  function buildDoc(n) {
    let oxIdx = 0;
    const groups = CATALOG.map((div) => {
      const rows = [];
      div.items.forEach((it) => {
        if (it.per) {
          for (let c = 1; c <= n; c++) rows.push({ it, sub: `압축기#${c}`, first: c === 1, span: n, v: it.v.map((x) => (c === 1 ? x : (Number(x) + c * 0.01).toFixed(2))) });
        } else if (it.pair) {
          it.pair.forEach((p, i) => rows.push({ it, sub: p, first: i === 0, span: 2, v: it.v[i] }));
        } else {
          rows.push({ it, sub: "", first: true, span: 1, merge: true, v: it.ox ? OX[oxIdx++ % 3].map(ox) : it.v });
        }
      });
      const body = rows.map((r, i) => {
        const lead = i === 0 ? `<td class="op-l" rowspan="${rows.length}">${div.division}</td><td class="op-l" rowspan="${rows.length}">${div.eq}</td>` : "";
        const item = r.first ? `<td class="op-l" rowspan="${r.span}">${r.it.label}</td>` : "";
        const subRef = r.merge
          ? `<td class="op-ref" colspan="2">${r.it.ref}</td>`
          : `<td class="op-sub">${r.sub}</td>${r.first ? `<td class="op-ref" rowspan="${r.span}">${r.it.ref}</td>` : ""}`;
        const cells = r.it.ox ? r.v.map((x) => `<td>${x}</td>`).join("") : vals(r.v);
        return `<tr>${lead}${item}${subRef}${cells}</tr>`;
      }).join("");
      return `<tbody${rows.length <= 14 ? " class=\"op-keep\"" : ""}>${body}</tbody>`;
    }).join("");

    return `
      <div class="pdf-doc">
        <div class="pdf-head">
          <div>
            <h1 class="pdf-title"><small>OPERATION</small>운전일지</h1>
            <p class="pdf-meta">A지구 · 본관 · <b>저온챔버 #${n === 1 ? 2 : 5} (압축기 ${n}대)</b><br />2026.09.20 (일)</p>
          </div>
          <div class="approval-bar">
            <div class="approval-slot"><div class="approval-slot-header">안전관리원</div><div class="approval-slot-body"><div class="approval-approved"><span class="approval-approved-date">2026.09.20</span><div class="approval-approved-name">홍길동1</div></div></div></div>
            <div class="approval-slot"><div class="approval-slot-header">안전관리책임자</div><div class="approval-slot-body"><div class="approval-approved"><span class="approval-approved-date">2026.09.21</span><div class="approval-approved-name">홍길동2</div></div></div></div>
            <div class="approval-slot"><div class="approval-slot-header">안전관리총괄자</div><div class="approval-slot-body"><div class="approval-approved"><span class="approval-approved-date">2026.09.21</span><div class="approval-approved-name">홍길동3</div></div></div></div>
          </div>
        </div>
        <table class="pdf-table op-pdf-table">
          <colgroup><col style="width:50px" /><col style="width:70px" /><col style="width:92px" /><col style="width:58px" /><col style="width:138px" />${SLOTS.map(() => `<col style="width:68px" />`).join("")}</colgroup>
          <thead><tr><th>구분</th><th>사용장비</th><th colspan="2">점검항목</th><th>실측 기준</th>${SLOTS.map((s) => `<th>${s}</th>`).join("")}</tr></thead>
          ${groups}
          <tbody><tr><td class="op-l">비고</td><td class="op-note" colspan="8">${NOTE}</td></tr></tbody>
        </table>
        <div class="op-printed">출력: 2026.09.29 12:10 · 홍길동2</div>
      </div>`;
  }
  document.getElementById("pdfPrintRoot").innerHTML = buildDoc(1) + buildDoc(6);
</script>
</body>
</html>
