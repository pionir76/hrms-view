<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>검사이력 일괄등록 시안</title>
<link rel="stylesheet" href="../common/css/common.css" />
<link rel="stylesheet" href="../pages/equipment/equipment.css" />
<link rel="stylesheet" href="../pages/org/org.css" />
<style>
  /* 시안 전용 — 장비 관리 화면 위에 뜬 "검사이력 일괄등록" 팝업. ?s=1(작성) / ?s=2(등록 결과) (2026-10-27) */
  body { width: 1500px; min-height: 980px; padding: 0; background: var(--color-bg); }
  .mk-cap { position: absolute; left: 24px; top: 14px; z-index: 300; margin: 0; font-size: 13px; font-weight: 800; color: #fff; }
  .mk-cap small { margin-left: 8px; font-weight: 500; opacity: 0.85; }

  /* 배경: 장비 관리 좌측 영역(버튼 위치만 보이게) */
  .mk-page { display: flex; gap: 18px; padding: 70px 24px 24px; }
  .mk-left { width: 230px; padding: 16px; border-radius: var(--radius-lg); background: #fff; box-shadow: var(--shadow-card); }
  .mk-left .field { margin-bottom: 10px; }
  .mk-left .btn { width: 100%; }
  .mk-left .btn + .btn { margin-top: 8px; }
  .mk-right { flex: 1; height: 880px; border-radius: var(--radius-lg); background: #fff; box-shadow: var(--shadow-card); }

  .modal-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.45); }
  .bk-box { width: 1180px; max-height: 900px; display: flex; flex-direction: column; }
  .bk-split { display: grid; grid-template-columns: 430px 1fr; gap: 22px; min-height: 0; }
  .bk-form .field { margin-bottom: 12px; }
  .bk-copy-note {
    margin: 4px 0 0; padding: 9px 12px; border-radius: 10px; background: #f5f8ff;
    font-size: 12px; line-height: 1.5; color: var(--color-text-sub);
  }
  .bk-copy-note b { color: var(--color-brand-navy); }
  .bk-targets { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--color-border-soft); padding-left: 22px; }
  .bk-targets .om-sec-head { margin-bottom: 8px; }
  .bk-targets .om-equip-groups { height: 520px; overflow-y: auto; }
  .bk-excluded { margin: 8px 0 0; font-size: 11.5px; color: var(--color-text-faint); }
  .modal-footer .bk-summary { margin-right: auto; font-size: 12.5px; color: var(--color-text-muted); }
  .modal-footer .bk-summary b { color: var(--color-text); }

  /* 결과 */
  .bk-result { padding: 4px 2px; }
  .bk-result-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .bk-result-head .big { font-size: 26px; font-weight: 800; color: var(--color-brand-navy); }
  .bk-result-head .big small { font-size: 14px; color: var(--color-text-muted); }
  .bk-bar { height: 8px; border-radius: 99px; background: #eef1f6; overflow: hidden; margin-bottom: 16px; }
  .bk-bar i { display: block; height: 100%; width: 100%; background: var(--accent-grad); }
  .bk-fail { border: 1px solid #f6c7cd; border-radius: 10px; background: #fff7f8; padding: 10px 14px; }
  .bk-fail h4 { margin: 0 0 6px; font-size: 13px; color: #c4142c; }
  .bk-fail li { font-size: 12.5px; color: var(--color-text-sub); margin: 2px 0; }
</style>
</head>
<body>
  <p class="mk-cap" id="cap"></p>
  <div class="mk-page">
    <aside class="mk-left">
      <div class="field"><label>지역</label><select><option>전체</option></select></div>
      <div class="field"><label>시설동</label><select><option>전체</option></select></div>
      <div class="field"><label>상태</label><select><option>전체</option></select></div>
      <div class="field"><label>장비명 검색</label><input type="text" placeholder="장비명으로 검색" /></div>
      <div class="eq-left-divider"></div>
      <button type="button" class="btn btn-primary">+ 신규 등록</button>
      <button type="button" class="btn btn-secondary">검사이력 일괄등록</button>
    </aside>
    <section class="mk-right"></section>
  </div>

  <div class="modal-overlay">
    <div class="modal-box eq-popup-box bk-box">
      <div class="modal-header eq-modal-header">
        <div>
          <span class="eq-modal-eyebrow">Inspection · Bulk</span>
          <h2 class="eq-modal-title">검사이력 일괄등록</h2>
          <p class="eq-compressor-popup-subtitle">같은 검사이력을 선택한 장비마다 한 건씩 등록합니다(시스템관리자 전용)</p>
        </div>
        <button type="button" class="modal-close-btn" aria-label="닫기">×</button>
      </div>
      <div class="modal-body" id="body"></div>
      <div class="modal-footer" id="footer"></div>
    </div>
  </div>

<script>
  const s = new URLSearchParams(location.search).get("s") || "1";
  const GROUPS = [
    ["A 지구", "차량시험동", ["수밀챔버 #1", "수밀챔버 #2", "시트컴포트(저온)&HOT챔버", "저온챔버 #1", "저온챔버 #2", "BSR #2"], 6, true],
    ["A 지구", "차량장비동", ["BSR #1", "BSR #3"], 2, false],
    ["A 지구", "PDI 1동", ["실차환경챔버 #1", "실차환경챔버 #2"], 2, false],
    ["A 지구", "PT 배기환경시험동", ["인증환경챔버 #1", "인증환경챔버 #2", "인증환경챔버 #3", "인증환경챔버 #4"], 0, false],
    ["B 지구", "강설시험동", ["강설강우풍동 #1", "강설강우풍동 #2", "소크룸#2", "MAU/공조기"], 2, true],
    ["B 지구", "무향1동", ["디젤1실"], 0, false],
    ["B 지구", "배기1동", ["소크룸 #1", "소크룸 #2", "환경챔버 #1", "환경챔버 #2"], 0, false],
    ["C 지구", "고지환경시험동", ["실차고지챔버 #1", "실차고지챔버 #2"], 2, false],
  ];
  const groupHtml = ([region, bld, names, sel, expanded]) => {
    const state = sel === 0 ? "" : sel === names.length ? "on" : "part";
    return `<div class="om-group${expanded ? " expanded" : ""}">
      <div class="om-group-head">
        <button type="button" class="om-cb ${state}"></button>
        <button type="button" class="om-group-name"><span>${region} · ${bld}</span><em>${sel}/${names.length}</em><i class="om-chevron"></i></button>
      </div>
      <div class="om-group-items">${names.map((n, i) => `<label class="om-equip-item"><input type="checkbox" ${i < sel ? "checked" : ""} /><span>${n}</span></label>`).join("")}</div>
    </div>`;
  };

  if (s === "1") {
    document.getElementById("cap").innerHTML = "시안 1 — 작성<small>왼쪽 검사이력 내용 + 오른쪽 대상 장비 선택 → [14대에 등록]</small>";
    document.getElementById("body").innerHTML = `
      <div class="bk-split">
        <div class="bk-form">
          <div class="field"><label>실시일자</label><input type="date" value="2026-10-27" /></div>
          <div class="field"><label>제목</label><input type="text" value="2026년 하반기 정기 안전검사" /></div>
          <div class="field"><label>검사내용</label><textarea rows="6">한국가스안전공사 정기검사 실시
- 안전밸브 작동 확인
- 압력계 교정 상태 확인</textarea></div>
          <div class="field"><label>비고</label><textarea rows="2">검사 결과 이상 없음</textarea></div>
          <div class="field">
            <label class="eq-attach-label">첨부파일<span class="eq-attach-limit">파일당 최대 10MB</span></label>
            <div class="attachment-list">
              <div class="attachment-item"><span class="attachment-name">정기검사_결과보고서.pdf</span><span class="attachment-size">2.4MB</span><button type="button" class="attachment-delete-btn">삭제</button></div>
            </div>
            <label class="btn btn-secondary eq-photo-upload-btn">파일 추가<input type="file" hidden /></label>
          </div>
          <p class="bk-copy-note">저장하면 선택한 <b>장비마다 같은 검사이력이 한 건씩</b> 생기고, 첨부파일도 장비마다 함께 올라갑니다(14대 × 2.4MB ≈ 34MB). 등록 뒤에는 각 장비의 "검사이력"에서 따로 고치거나 지울 수 있고, 한꺼번에 고치는 기능은 없습니다.</p>
        </div>
        <div class="bk-targets">
          <div class="om-sec-head">
            <h3 class="om-sec-title">대상 장비</h3>
            <span class="om-equip-count">선택 14대 / 전체 152대</span>
            <button type="button" class="om-equip-all"><span class="om-cb part"></span><span>전체 선택</span></button>
            <input type="search" class="om-search om-equip-search" placeholder="장비명·시설동 검색" />
          </div>
          <div class="om-equip-groups">${GROUPS.map(groupHtml).join("")}</div>
          <p class="bk-excluded">철거 장비 6대는 목록에 없습니다.</p>
        </div>
      </div>`;
    document.getElementById("footer").innerHTML = `
      <span class="bk-summary">대상 <b>14대</b> · 첨부 1개</span>
      <button type="button" class="btn btn-secondary">닫기</button>
      <button type="button" class="btn btn-primary">14대에 등록</button>`;
  } else {
    document.getElementById("cap").innerHTML = "시안 2 — 등록 결과<small>장비마다 순서대로 등록, 끝나면 결과 요약(실패한 장비만 다시 시도)</small>";
    document.getElementById("body").innerHTML = `
      <div class="bk-result">
        <div class="bk-result-head"><span class="big">13 <small>/ 14대 등록</small></span><span class="badge badge-warning">1대 실패</span></div>
        <div class="bk-bar"><i></i></div>
        <div class="bk-fail">
          <h4>등록하지 못한 장비</h4>
          <ul>
            <li>A 지구 · 차량시험동 · BSR #2 — 서버와 연결이 끊겨 등록하지 못했습니다.</li>
          </ul>
        </div>
        <p class="bk-copy-note" style="margin-top: 14px">등록된 검사이력은 각 장비의 "검사이력"에서 볼 수 있습니다. 실패한 장비만 [실패한 장비 다시 시도]로 다시 올릴 수 있습니다.</p>
      </div>`;
    document.getElementById("footer").innerHTML = `
      <button type="button" class="btn btn-secondary">실패한 장비 다시 시도</button>
      <button type="button" class="btn btn-primary">닫기</button>`;
  }
</script>
</body>
</html>
